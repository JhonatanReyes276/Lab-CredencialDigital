<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Young+Serif&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/574a04a5a6.js" crossorigin="anonymous"></script>
</head>
<body>
    <main class="contenedor">
        <section class="credencial">
            <div class="insignia">VERIFIED</div>
            <header id="encabezado" class="encabezado">
                <div class="avatar">
                    <span class="online">ONLINE</span>
                    <img class="foto" src="IMG_20260505_130924.jpg" alt="Foto de perfil">
                </div>
                <h1 class="nombre">Jhonatan David Reyes Rubio</h1>
                <p class="rol">Desarrollador Full Stack/Java</p>
            </header>

            <section id="informacion" class="informacion">
                <div class="item">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>Bogotá</span>
                </div>
                <div class="item">
                    <i class="fa-solid fa-envelope"></i>
                    <span>jhonrey@email.com</span>
                </div>
                <div class="item">
                    <i class="fa-solid fa-code"></i>
                    <span>Tecnología favorita: JavaScript</span>
                </div>
                <div class="item">
                    <i class="fa-solid fa-futbol"></i>
                    <span>Hobby: Jugar fútbol</span>
                </div>
                <div class="item">
                    <i class="fa-brands fa-github"></i>
                    <span>https://github.com/JhonatanReyes276</span>
                </div>
            </section>

            <footer id="pie" class="pie">
                <p class="frase">"No te juzgues por cuántas veces te caes, sino por cuántas te levantas"</p>
            </footer>

        </section>

    </main>

</body>
</html>
